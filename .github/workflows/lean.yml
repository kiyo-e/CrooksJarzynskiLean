name: Lean

on:
  pull_request:
  push:
    branches:
      - crooks-jarzynski-lean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and restore Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build project
        run: |
          set +e
          lake build > build.log 2>&1
          status=$?
          cat build.log
          exit "$status"
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: build.log
          if-no-files-found: error
