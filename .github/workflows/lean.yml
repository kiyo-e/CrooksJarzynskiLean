name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore Elan toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
      - name: Resolve dependencies, audit proofs, and build
        shell: bash
        run: |
          set +e
          status=0
          audit_files=(
            CrooksJarzynski/AxiomAudit.lean
            CrooksJarzynski/AxiomAuditDriven.lean
          )
          : > axiom-audit.log
          {
            echo "Lean toolchain: $(cat lean-toolchain)"
            lake exe cache get || status=1
            if [ "$status" -eq 0 ]; then
              lake build || status=1
            fi
            echo
            echo "Checking for proof placeholders and custom axiom declarations..."
            if grep -RInE --include='*.lean' \
              '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' \
              CrooksJarzynski.lean CrooksJarzynski; then
              echo "Proof source audit failed."
              status=1
            else
              echo "Proof source audit passed."
            fi
            if [ "$status" -eq 0 ]; then
              echo
              echo "Printing axioms of the headline theorems..."
              for audit_file in "${audit_files[@]}"; do
                echo "== $audit_file ==" >> axiom-audit.log
                lake env lean "$audit_file" >> axiom-audit.log 2>&1 || status=1
              done
              cat axiom-audit.log
              axiom_reports="$(grep -Ec \
                'depends on axioms:|does not depend on any axioms' \
                axiom-audit.log)"
              expected_axiom_reports="$(
                grep -hE '^[[:space:]]*#print axioms ' "${audit_files[@]}" \
                  | wc -l \
                  | tr -d '[:space:]'
              )"
              if [ "$axiom_reports" -ne "$expected_axiom_reports" ]; then
                echo "Kernel axiom audit did not report every headline theorem."
                status=1
              else
                unexpected_axioms="$(
                  awk '
                    /depends on axioms: \[/ {
                      line = $0
                      sub(/^.*depends on axioms: \[/, "", line)
                      while (line !~ /\]$/ && getline continuation > 0) {
                        line = line " " continuation
                      }
                      sub(/\].*$/, "", line)
                      print line
                    }
                  ' axiom-audit.log \
                    | tr ',' '\n' \
                    | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
                    | grep -Evx \
                      'propext|Classical\.choice|Quot\.sound' \
                    || true
                )"
                if [ -n "$unexpected_axioms" ]; then
                  printf '%s\n' "$unexpected_axioms"
                  echo "Kernel axiom audit found an unapproved axiom."
                  status=1
                else
                  echo "Kernel axiom audit passed."
                fi
              fi
            fi
          } > build.log 2>&1
          printf '%s\n' "$status" > build.status
          tail -n 220 build.log
          exit 0
      - name: Upload compiler diagnostics and dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-build-log
          path: |
            build.log
            build.status
            axiom-audit.log
            lake-manifest.json
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat build.status)"
