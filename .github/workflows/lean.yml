name: Lean

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake workspace
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        shell: bash
        run: |
          set +e
          {
            echo "Lean toolchain: $(cat lean-toolchain)"
            lake update
            lake exe cache get
            lake build
          } > build.log 2>&1
          status=$?
          printf '%s\n' "$status" > build.status
          tail -n 160 build.log
          exit 0
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: |
            build.log
            build.status
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        shell: bash
        run: exit "$(cat build.status)"
