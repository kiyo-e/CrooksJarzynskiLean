name: Lean

on:
  pull_request:
  push:
    branches:
      - crooks-jarzynski-lean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        run: |
          set +e
          {
            lake update
            lake exe cache get
            lake build
          } > build.log 2>&1
          status=$?
          printf '%s\n' "$status" > build.status
          tail -n 120 build.log
          exit 0
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: |
            build.log
            build.status
          if-no-files-found: error
      - name: Propagate build status
        if: always()
        run: exit "$(cat build.status)"
